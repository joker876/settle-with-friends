<app-card class="card-with-heading" [class.danger-zone]="dangerZone()">
  <app-stack>
    <div class="heading-row-grid">
      <div>
        <h2 class="heading">{{ heading() }}</h2>
        @if (subheading()) {
          <app-statistic class="subheading">{{ subheading() }}</app-statistic>
        }
      </div>
      <ng-content select="heading-row-items" />
    </div>
    <ng-content />
  </app-stack>
</app-card>
