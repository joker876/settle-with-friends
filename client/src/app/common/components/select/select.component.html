<ard-select
  [(value)]="value"
  [items]="options()"
  valueFrom="value"
  labelFrom="label"
  [placeholder]="placeholder()"
  [disabled]="disabled()"
  [id]="htmlId()"
  [isLoading]="areOptionsLoading()"
  [searchable]="searchable()"
  [clearable]="false"
  [addCustom]="addCustomFn()"
  [compareWith]="compareWithFn()"
  [appearance]="appearance()"
  [hasError]="hasError()"
  [multiselectable]="multiselectable()"
  [keepOpen]="multiselectable()"
  (close)="close.emit()"
  (valueChange)="change.emit($event)"
  (blur)="emitTouched()"
>
  @if (withPrefix()) {
    <ng-template ard-prefix-tmp>
      <ng-content />
    </ng-template>
  }
  <ng-template ard-value-tmp let-itemData="itemData" let-index="index" let-totalItems="itemsSelectedCount">
    <span class="select-value" [class.searchable]="searchable()">
      {{ dynamicLabelMap() ? dynamicLabelMap()![itemData.value] : (itemData.selectedLabel ?? itemData.label)
      }}{{ totalItems > 1 && index < totalItems ? ', ' : '' }}
    </span>
  </ng-template>

  <ng-template ard-option-tmp let-label="label" let-itemData="itemData" let-selected="selected">
    <div class="option">
      <span class="label">{{ dynamicLabelMap() ? dynamicLabelMap()![itemData.value] : label }}</span>
      @if (selected) {
        <ard-icon-check class="check-icon" />
      }
    </div>
  </ng-template>

  <ng-template ard-dropdown-arrow-tmp>
    <ard-icon-chevron class="dropdown-arrow" />
  </ng-template>
</ard-select>
