<div class="heading-container">
  <div class="heading-and-show-all">
    <h2>{{ heading() }}</h2>
    @if (showAllButton()) {
      <app-text-btn (click)="showAllButtonClick.emit()">
        <span class="large">Zobacz wszystkie</span>
        <span class="small">Wszystkie</span>
        <ard-icon-chevron class="chevron" direction="right" />
      </app-text-btn>
    }
  </div>

  <div class="actions">
    <ng-content />
  </div>
</div>
