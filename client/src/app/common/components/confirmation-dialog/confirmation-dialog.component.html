<ard-dialog
  [heading]="heading()"
  [confirmButtonText]="confirmButtonTextWithTime()"
  [confirmButtonColor]="confirmButtonColor()"
  rejectButtonText="Anuluj"
  [(open)]="open"
  (confirm)="submit.emit()"
  [canConfirm]="!isSubmitLoading() && canConfirm()"
  (reject)="open.set(false)"
>
  <div class="content">
    <ng-content />
  </div>
</ard-dialog>
