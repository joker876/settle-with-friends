<app-statistic-with-value text="Kurs wymiany" i18n-text="@@common.currency-rate">
  1 {{ currencyCode() }}
  =
  <app-balance [balance]="value()!" [currency]="mainCurrency()" places="4-4" [class.disabled]="isValueLoading()" />
</app-statistic-with-value>
<ard-icon-button (click)="openDialog()">
  <ard-icon-edit-line-2 class="icon" />
</ard-icon-button>

<ard-dialog
  heading="Modyfikuj kurs wymiany"
  i18n-heading="@@common.modify-currency-rate"
  [(open)]="isDialogOpen"
  [canConfirm]="tempValue() !== null"
  (confirm)="onConfirmDialog()"
>
  <div class="dialog-content">
    <ard-number-input [(value)]="tempValue" maxDecimalPlaces="4">
      <ng-template ard-prefix-tmp>
        <div class="text3">1 {{ currencyCode() }} =&nbsp;</div>
      </ng-template>
      <ng-template ard-suffix-tmp>
        <div class="text3">{{ mainCurrency() }}</div>
      </ng-template>
    </ard-number-input>
    <p>
      <small>
        <ng-container i18n="@@common.currency-rate-for-date"
          >Kurs wymiany według NBP na dzień {{ selectedTransactionDate() | date: 'd MMM yyyy' }}:</ng-container
        >
        1 {{ currencyCode() }}
        =
        @if (currencyRateFromApi(); as rate) {
          <app-balance [balance]="rate" [currency]="mainCurrency()" places="4-4" [class.disabled]="isValueLoading()" />
        } @else {
          <ng-container i18n="@@common.loading...">Ładowanie...</ng-container>
        }
      </small>
    </p>
  </div>
</ard-dialog>
