<div class="login-container">
  <div class="login-card">
    <div class="custom-user-icon"></div>
    <button class="google-login-btn" (click)="login()">
      <div class="google-logo">
        <app-google-logo />
      </div>
      <span i18n="@@login.google-login">Zaloguj się za pomocą Google</span>
    </button>

    <div class="under-text" i18n="@@login.google-login-under-text">Zaloguj się za pomocą prywatnego konta Google</div>
  </div>
</div>
