<div class="page-wrapper-g">
  <h1>{{ reckoningService.reckoning.value()?.name ?? '&nbsp;' }}</h1>

  <section>
    <app-transaction-list
      [transactions]="transactionListService.transactions.value()"
      partialList
      (showAllButtonClick)="navigateToTransactions()"
      (createTransactionClick)="navigateToCreateTransaction()"
      (editTransactionClick)="navigateToEditTransaction($event)"
      (deleteTransactionConfirm)="removeTransaction($event)"
    />
  </section>
  <section>
    <app-payment-list
      [payments]="paymentListService.payments.value()"
      partialList
      (showAllButtonClick)="navigateToPayments()"
      (appendPayment)="appendPayment($event)"
      (refreshPayment)="refreshPayment($event)"
      (removePayment)="removePayment($event)"
    />
  </section>
</div>
