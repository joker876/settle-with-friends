<app-section-heading i18n-heading="@@reckoning-page.transactions.heading" heading="Transakcje">
  <ard-button (click)="createTransactionClick.emit()" appearance="outlined" color="primary">
    <ard-icon-plus class="icon" />
    <span i18n="@@common.add">Dodaj</span>
  </ard-button>
</app-section-heading>
<div class="transaction-list">
  @for (transx of transactions(); track transx.id) {
  <app-transaction-list-item [data]="transx" [mainCurrency]="mainCurrency()" />
  }
</div>
