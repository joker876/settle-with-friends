<div class="page-wrapper-g">
  <app-stack>
    <app-view-h1
      heading="Dane transakcji"
      i18n-heading="@@create-transaction.heading"
      subheading="Wprowadź szczegóły transakcji"
      i18n-subheading="@@create-transaction.subheading"
    />
    <form>
      <app-stack>
        <app-card-with-heading
          heading="Informacje podstawowe"
          i18n-heading="@@create-transaction.basic-info"
          subheading="Podstawowe informacje o o transakcji"
          i18n-subheading="@@create-transaction.basic-info-subheading"
        >
          <ard-grid container>
            <ard-grid size="12">
              <ard-form-field>
                <ard-label i18n="@@create-transaction.field.name.label" required>Tytuł transakcji</ard-label>
                <ard-input
                  [formControl]="form.controls.transaction.controls.name"
                  placeholder="np. Zakupy, Paliwo, Restauracja"
                  i18n-placeholder="@@create-transaction.field.name.placeholder"
                />
                <ard-auto-error [control]="form.controls.transaction.controls.name" />
              </ard-form-field>
            </ard-grid>
            <ard-grid size="12">
              <ard-form-field>
                <ard-label i18n="@@create-transaction.field.date.label" required>Data transakcji</ard-label>
                <ard-date-input
                  [formControl]="form.controls.transaction.controls.transactionDate"
                  [max]="TODAY"
                  placeholder="DD.MM.YYYY"
                  i18n-placeholder="@@create-transaction.field.date.placeholder"
                />
                <ard-auto-error [control]="form.controls.transaction.controls.transactionDate" />
              </ard-form-field>
            </ard-grid>
            <ard-grid size="12 sm:6">
              <div class="amount-row">
                <ard-form-field>
                  <ard-label i18n="@@create-transaction.field.amount.label" required>Kwota</ard-label>
                  <ard-number-input
                    [formControl]="form.controls.transaction.controls.amount"
                    placeholder="np. 307,42"
                    i18n-placeholder="@@create-transaction.field.amount.placeholder"
                  />
                  <ard-auto-error [control]="form.controls.transaction.controls.amount" />
                </ard-form-field>
                <ard-form-field>
                  <ard-label>&nbsp;</ard-label>
                  <app-select [options]="currencies()" [control]="form.controls.transaction.controls.currencyCode" />
                  <ard-auto-error [control]="form.controls.transaction.controls.currencyCode" />
                </ard-form-field>
              </div>
            </ard-grid>
            @if (currencyCodeValue() && currencyCodeValue() !== currencies()[0].value) {
            <ard-grid size="12 sm:6">
              <app-currency-rate-input
                [mainCurrency]="currencies()[0].value"
                [currencyCode]="currencyCodeValue()"
                [formControl]="form.controls.transaction.controls.currencyRate"
                [isCurrencyRateFromApiControl]="form.controls.transaction.controls.isCurrencyRateFromApi"
                [isValueLoading]="isCurrencyRateLoading() && !form.controls.transaction.controls.currencyRate.touched"
              />
            </ard-grid>
            }
          </ard-grid>
        </app-card-with-heading>
        <app-card-with-heading
          heading="Osoby płacące"
          i18n-heading="@@create-transaction.payers"
          subheading="Podaj, kto i ile zapłacił za transakcję"
          i18n-subheading="@@create-transaction.payers.subheading"
        >
          <app-payers-adder
            [formControl]="form.controls.payers"
            [totalAmount]="formValue()!.transaction!.amount!"
            [currencyCode]="currencyCodeValue()"
          />
        </app-card-with-heading>
        <app-card-with-heading
          heading="Podział kosztów"
          i18n-heading="@@create-transaction.cost-splits"
          subheading="Podaj, do kogo należą poszczególne części rachunku"
          i18n-subheading="@@create-transaction.cost-splits.subheading"
        >
        </app-card-with-heading>
      </app-stack>
    </form>
  </app-stack>
</div>
