@if (value() === UserRole.Owner) {
  <app-statistic>{{ value() | userRole }}</app-statistic>
} @else {
  <app-role-guard [role]="UserRole.Owner">
    <app-select
      [(value)]="value"
      [options]="userOptions"
      appearance="transparent"
      searchable="false"
      [disabled]="isLoading() || disabled()"
    />

    <app-statistic ngProjectAs="else">
      <ng-container>{{ value() | userRole }}</ng-container>
    </app-statistic>
  </app-role-guard>
}
