<ard-dialog
  [(open)]="open"
  heading="Generowanie linku do zaproszenia"
  i18n-heading="@@settings.invite-link-dialog.heading"
  confirmButtonText="Generuj link"
  i18n-confirmButtonText="@@settings.invite-link-dialog.confirm-button"
  (confirm)="onSubmit()"
>
  <ard-stack>
    <ard-form-field>
      <ard-label required i18n="@@settings.invite-link-dialog.max-uses">Maksymalna ilość użyć</ard-label>
      <ard-number-input [formControl]="form.controls.maxUses" min="1" placeholder="0" allowFloat="false" maxDecimalPlaces="0" />
      <ard-auto-error [control]="form.controls.maxUses" />
    </ard-form-field>
    <ard-form-field>
      <ard-label required i18n="@@settings.invite-link-dialog.expires-in">Czas ważności linku</ard-label>
      <app-select [formControl]="form.controls.expiresInSeconds" [options]="EXPIRES_IN_OPTIONS" />
      <ard-auto-error [control]="form.controls.expiresInSeconds" />
    </ard-form-field>
  </ard-stack>
</ard-dialog>
