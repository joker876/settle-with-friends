<div class="page-wrapper-g">
  <div class="main-heading">
    <app-back-button link="../" />
    <h1>{{ reckoningService.reckoning.value()?.name ?? '&nbsp;' }}</h1>
  </div>

  <app-return-list
    [returns]="returnListService.returns.value()"
    [isArchived]="reckoningService.isArchived()"
    (appendReturn)="appendReturn($event)"
    (refreshReturn)="refreshReturn($event)"
    (removeReturn)="removeReturn($event)"
  />
</div>
